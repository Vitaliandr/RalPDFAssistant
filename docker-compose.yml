name: ralpdfassistant

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_pass}@db:5432/${POSTGRES_DB:-rag}
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: .
    # без .env тоже стартуем
    env_file:
      - path: .env
        required: false
    environment: *app-env
    # сначала миграции, 127.0.0.1 чтоб не торчало в сеть
    command: sh -c "alembic upgrade head && uvicorn ralpdfassistant.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/code/data/uploads
      - models:/code/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    # без .env тоже стартуем
    env_file:
      - path: .env
        required: false
    environment: *app-env
    #один процесс, e5 держит в памяти больше 2 ГБ
    command: celery -A ralpdfassistant.background.celery_app.celery worker --loglevel=info --concurrency=1
    volumes:
      - uploads:/code/data/uploads
      - models:/code/data/models
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  models:
