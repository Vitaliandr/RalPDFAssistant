<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RalPDFAssistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RalPDFAssistant</h1>
    <p>Загрузи PDF или текст и задавай вопросы по содержимому</p>
  </header>

  <main>
    <aside>
      <h2>Документы</h2>

      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.txt,.md" hidden>
        <span>Перетащи файл сюда или нажми, чтобы выбрать</span>
        <small>PDF, TXT, MD до 20 МБ</small>
      </label>

      <details>
        <summary>Вставить текст</summary>
        <input type="text" id="textTitle" placeholder="Название">
        <textarea id="textBody" rows="5" placeholder="Текст документа"></textarea>
        <button id="textSend">Добавить</button>
      </details>

      <ul id="docs"></ul>
      <p class="hint" id="docsHint">Пока ничего не загружено</p>
    </aside>

    <section class="chat">
      <div id="messages">
        <div class="msg bot">Привет! Загрузи документ слева, а потом спрашивай, например про тарифы или условия.</div>
      </div>

      <form id="form">
        <input type="text" id="question" placeholder="Твой вопрос по документам" autocomplete="off">
        <button type="submit" id="send">Спросить</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
